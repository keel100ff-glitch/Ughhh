name: Build APK FloatAI
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Project Files
        run: |
          mkdir -p app/src/main/java/com/example/floatai
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "FloatAI"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.2.2' apply false; id 'org.jetbrains.kotlin.android' version '1.9.22' apply false }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
          android {
              namespace 'com.example.floatai'
              compileSdk 34
              defaultConfig { applicationId "com.example.floatai"; minSdk 24; targetSdk 34; versionCode 1; versionName "1.0" }
              buildTypes { 
                  release { minifyEnabled false } 
                  debug { minifyEnabled false }
              }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application android:allowBackup="true" android:icon="@drawable/app_icon" android:label="FloatAI" android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".FloatingService" android:foregroundServiceType="mediaProjection" android:exported="false"/>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/app_icon.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#1A1A1A" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#00E5FF" android:pathData="M54,30 C40,30 30,40 30,54 C30,60 32,66 36,70 L36,78 L72,78 L72,70 C76,66 78,60 78,54 C78,40 68,30 54,30 Z"/>
              <path android:fillColor="#1A1A1A" android:pathData="M44,50 m-4,0 a4,4 0 1,0 8,0 a4,4 0 1,0 -8,0"/>
              <path android:fillColor="#1A1A1A" android:pathData="M64,50 m-4,0 a4,4 0 1,0 8,0 a4,4 0 1,0 -8,0"/>
              <path android:fillColor="#00E5FF" android:pathData="M50,62 Q54,66 58,62" android:strokeWidth="2" android:strokeColor="#1A1A1A" android:strokeLineCap="round"/>
              <path android:fillColor="#00E5FF" android:pathData="M50,30 L50,20 M58,30 L58,20 M50,20 A4,4 0 0,1 58,20" android:strokeWidth="2" android:strokeColor="#00E5FF"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/robot_icon.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#00E5FF" android:pathData="M12,2 C8,2 5,5 5,9 C5,11 6,13 7,14 L7,18 L17,18 L17,14 C18,13 19,11 19,9 C19,5 16,2 12,2 Z"/>
              <path android:fillColor="#1A1A1A" android:pathData="M9,8 m-2,0 a2,2 0 1,0 4,0 a2,2 0 1,0 -4,0"/>
              <path android:fillColor="#1A1A1A" android:pathData="M15,8 m-2,0 a2,2 0 1,0 4,0 a2,2 0 1,0 -4,0"/>
              <path android:fillColor="#1A1A1A" android:pathData="M9,12 Q12,14 15,12" android:strokeWidth="1" android:strokeColor="#1A1A1A" android:strokeLineCap="round"/>
              <path android:fillColor="#00E5FF" android:pathData="M10,2 L10,0 M14,2 L14,0" android:strokeWidth="1" android:strokeColor="#00E5FF"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_notification.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM12,17c-0.55,0 -1,-0.45 -1,-1s0.45,-1 1,-1 1,0.45 1,1 -0.45,1 -1,1zM13,13h-2V7h2v6z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:gravity="center" android:padding="24dp" android:background="#121212">
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="FloatAI" android:textColor="#00E5FF" android:textSize="28sp" android:textStyle="bold" android:layout_marginBottom="8dp"/>
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="WiFi Lemot Edition" android:textColor="#AAAAAA" android:textSize="14sp" android:layout_marginBottom="32dp"/>
              <EditText android:id="@+id/etApiKey" android:layout_width="match_parent" android:layout_height="wrap_content" android:hint="Masukkan API Key Gemini" android:textColorHint="#666666" android:textColor="#FFFFFF" android:backgroundTint="#00E5FF" android:layout_marginBottom="24dp"/>
              <Button android:id="@+id/btnStart" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Aktifkan Robot" android:backgroundTint="#00E5FF" android:textColor="#000000" android:textStyle="bold" android:layout_marginBottom="16dp"/>
              <Button android:id="@+id/btnStop" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="MATIKAN ROBOT" android:backgroundTint="#FF1744" android:textColor="#FFFFFF" android:textStyle="bold"/>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/floating_bubble.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="wrap_content" android:layout_height="wrap_content" android:background="@drawable/robot_icon" android:padding="8dp">
          </FrameLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/floating_menu.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="220dp" android:layout_height="wrap_content" android:orientation="vertical" android:background="@drawable/bg_rounded" android:padding="16dp">
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Pilih Mode" android:textColor="#00E5FF" android:textStyle="bold" android:textSize="16sp" android:layout_marginBottom="12dp"/>
              <Button android:id="@+id/btnJawab" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Jawab Langsung" android:backgroundTint="#333333" android:textColor="#FFFFFF" android:layout_marginBottom="8dp"/>
              <Button android:id="@+id/btnPenjelasan" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Penjelasan Lengkap" android:backgroundTint="#333333" android:textColor="#FFFFFF" android:layout_marginBottom="8dp"/>
              <Button android:id="@+id/btnSembunyi" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="Sembunyikan Robot" android:backgroundTint="#111111" android:textColor="#AAAAAA"/>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_rounded.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#EE1E1E1E"/>
              <corners android:radius="16dp"/>
              <stroke android:width="1dp" android:color="#00E5FF"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/layout/floating_loading.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#88000000">
              <ProgressBar android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_gravity="center" android:indeterminateTint="#00E5FF"/>
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Mengirim gambar (mode hemat)..." android:textColor="#00E5FF" android:layout_gravity="center" android:layout_marginTop="60dp"/>
          </FrameLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/floating_answer.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="300dp" android:layout_height="wrap_content" android:orientation="vertical" android:background="@drawable/bg_rounded" android:padding="16dp">
              <TextView android:id="@+id/tvAnswer" android:layout_width="match_parent" android:layout_height="wrap_content" android:textColor="#FFFFFF" android:textSize="14sp" android:maxHeight="400dp" android:scrollbars="vertical"/>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/floatai/MainActivity.kt
          package com.example.floatai
          import android.app.Activity
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.EditText
          import android.widget.Toast

          class MainActivity : Activity() {
              private val projectionManager by lazy { getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager }
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
                  
                  val etApiKey = findViewById<EditText>(R.id.etApiKey)
                  val prefs = getSharedPreferences("FloatAIPrefs", MODE_PRIVATE)
                  etApiKey.setText(prefs.getString("api_key", ""))

                  findViewById<Button>(R.id.btnStart).setOnClickListener {
                      val key = etApiKey.text.toString().trim()
                      if (key.isEmpty()) {
                          Toast.makeText(this, "API Key jangan kosong mass!", Toast.LENGTH_SHORT).show()
                          return@setOnClickListener
                      }
                      prefs.edit().putString("api_key", key).apply()

                      if (!Settings.canDrawOverlays(this)) {
                          startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      } else {
                          startActivityForResult(projectionManager.createScreenCaptureIntent(), 1001)
                      }
                  }

                  findViewById<Button>(R.id.btnStop).setOnClickListener {
                      stopService(Intent(this, FloatingService::class.java))
                      Toast.makeText(this, "Robot dimatikan!", Toast.LENGTH_SHORT).show()
                  }
              }
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 1001 && resultCode == RESULT_OK && data != null) {
                      ScreenCaptureHelper.resultCode = resultCode
                      ScreenCaptureHelper.data = data
                      startForegroundService(Intent(this, FloatingService::class.java))
                      finish()
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/floatai/ScreenCaptureHelper.kt
          package com.example.floatai
          import android.content.Intent
          object ScreenCaptureHelper { var resultCode: Int = 0; var data: Intent? = null }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/floatai/FloatingService.kt
          package com.example.floatai
          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjectionManager
          import android.os.*
          import android.util.Base64
          import android.view.*
          import android.widget.Button
          import android.widget.TextView
          import android.widget.Toast
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.BufferedReader
          import java.io.ByteArrayOutputStream
          import java.io.InputStreamReader
          import java.io.OutputStreamWriter
          import java.net.HttpURLConnection
          import java.net.URL
          import kotlin.concurrent.thread

          class FloatingService : Service() {
              private lateinit var windowManager: WindowManager
              private lateinit var bubbleView: View
              private var answerView: View? = null
              private var menuView: View? = null
              private var loadingView: View? = null
              
              private var API_KEY = ""
              private var isHidden = false

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  API_KEY = getSharedPreferences("FloatAIPrefs", MODE_PRIVATE).getString("api_key", "") ?: ""

                  val channelId = "float_ai"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(channelId, "FloatAI", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
                  val notif = Notification.Builder(this, channelId).setContentTitle("Robot Siaga").setSmallIcon(R.drawable.ic_notification).build()
                  startForeground(1, notif)
                  showBubble()
              }

              private fun showBubble() {
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  bubbleView = LayoutInflater.from(this).inflate(R.layout.floating_bubble, null)
                  val params = WindowManager.LayoutParams(
                      120, 120,
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else WindowManager.LayoutParams.TYPE_PHONE,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT
                  )
                  params.gravity = Gravity.TOP or Gravity.START
                  params.x = 100; params.y = 300
                  
                  bubbleView.setOnTouchListener(object : View.OnTouchListener {
                      var initialX = 0; var initialY = 0; var touchX = 0f; var touchY = 0f
                      override fun onTouch(v: View, event: MotionEvent): Boolean {
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> { initialX = params.x; initialY = params.y; touchX = event.rawX; touchY = event.rawY; return false }
                              MotionEvent.ACTION_MOVE -> { params.x = initialX + (event.rawX - touchX).toInt(); params.y = initialY + (event.rawY - touchY).toInt(); windowManager.updateViewLayout(bubbleView, params); return true }
                          }
                          return false
                      }
                  })

                  bubbleView.setOnClickListener {
                      if (!isHidden) showMenu()
                  }
                  windowManager.addView(bubbleView, params)
              }

              private fun showMenu() {
                  if (menuView != null) return
                  menuView = LayoutInflater.from(this).inflate(R.layout.floating_menu, null)
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else WindowManager.LayoutParams.TYPE_PHONE,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT
                  )
                  params.gravity = Gravity.CENTER

                  menuView!!.findViewById<Button>(R.id.btnJawab).setOnClickListener {
                      closeMenu()
                      showLoadingAndCapture(false)
                  }
                  menuView!!.findViewById<Button>(R.id.btnPenjelasan).setOnClickListener {
                      closeMenu()
                      showLoadingAndCapture(true)
                  }
                  menuView!!.findViewById<Button>(R.id.btnSembunyi).setOnClickListener {
                      closeMenu()
                      toggleHide()
                  }
                  windowManager.addView(menuView, params)
              }

              private fun closeMenu() {
                  if (menuView != null) {
                      windowManager.removeView(menuView)
                      menuView = null
                  }
              }

              private fun toggleHide() {
                  isHidden = !isHidden
                  if (isHidden) {
                      bubbleView.alpha = 0.01f
                      Toast.makeText(this, "Mode Samaran aktif", Toast.LENGTH_SHORT).show()
                  } else {
                      bubbleView.alpha = 1f
                  }
              }

              private fun showLoadingAndCapture(penjelasan: Boolean) {
                  if (loadingView != null) return
                  loadingView = LayoutInflater.from(this).inflate(R.layout.floating_loading, null)
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT, WindowManager.LayoutParams.MATCH_PARENT,
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else WindowManager.LayoutParams.TYPE_PHONE,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT
                  )
                  windowManager.addView(loadingView, params)
                  
                  Handler(Looper.getMainLooper()).postDelayed({
                      captureAndSolve(penjelasan)
                  }, 500)
              }

              private fun removeLoading() {
                  if (loadingView != null) {
                      windowManager.removeView(loadingView)
                      loadingView = null
                  }
              }

              private fun captureAndSolve(penjelasan: Boolean) {
                  val data = ScreenCaptureHelper.data ?: return
                  val mpManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  val projection = mpManager.getMediaProjection(ScreenCaptureHelper.resultCode, data)
                  val metrics = resources.displayMetrics
                  val w = metrics.widthPixels; val h = metrics.heightPixels; val density = metrics.densityDpi
                  val imageReader = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 1)
                  val virtualDisplay = projection.createVirtualDisplay("cap", w, h, density, DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, imageReader.surface, null, null)
                  
                  thread {
                      Thread.sleep(300)
                      val image = imageReader.acquireLatestImage()
                      if (image != null) {
                          val planes = image.planes; val buffer = planes[0].buffer
                          val pixelStride = planes[0].pixelStride; val rowStride = planes[0].rowStride
                          val rowPadding = rowStride - pixelStride * w
                          val bitmap = Bitmap.createBitmap(w + rowPadding / pixelStride, h, Bitmap.Config.ARGB_8888)
                          bitmap.copyPixelsFromBuffer(buffer); image.close()
                          val cropped = Bitmap.createBitmap(bitmap, 0, 0, w, h)
                          askAIWithImage(cropped, penjelasan)
                      }
                      virtualDisplay.release(); projection.stop()
                  }
              }

              private fun askAIWithImage(bitmap: Bitmap, penjelasan: Boolean) {
                  thread {
                      try {
                          val stream = ByteArrayOutputStream()
                          // KOMPRES KE 30% BIAR RINGAN DI WIFI LEMOT
                          bitmap.compress(Bitmap.CompressFormat.JPEG, 30, stream)
                          val base64Image = Base64.encodeToString(stream.toByteArray(), Base64.NO_WRAP)

                          val url = URL("https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-pro:generateContent?key=$API_KEY")
                          val conn = url.openConnection() as HttpURLConnection
                          conn.requestMethod = "POST"
                          conn.setRequestProperty("Content-Type", "application/json")
                          conn.doOutput = true
                          
                          // TIMEOUT 30 DETIK BIAR GAK MUTER TERUS
                          conn.connectTimeout = 30000
                          conn.readTimeout = 30000

                          val promptText = if (penjelasan) {
                              "Baca soal di gambar ini. Berikan jawaban DAN penjelasan langkah demi langkah yang lengkap."
                          } else {
                              "Baca soal di gambar ini. Berikan HANYA jawaban akhirnya saja (opsi A/B/C/D atau teks singkat) tanpa penjelasan."
                          }

                          val bodyJson = JSONObject().apply {
                              put("contents", JSONArray().apply { 
                                  put(JSONObject().apply { 
                                      put("parts", JSONArray().apply { 
                                          put(JSONObject().put("text", promptText))
                                          put(JSONObject().apply { 
                                              put("inline_data", JSONObject().apply {
                                                  put("mime_type", "image/jpeg")
                                                  put("data", base64Image)
                                              })
                                          })
                                      }) 
                                  }) 
                              })
                          }

                          val os = OutputStreamWriter(conn.outputStream)
                          os.write(bodyJson.toString())
                          os.flush()
                          os.close()

                          val responseCode = conn.responseCode
                          if (responseCode == 200) {
                              val reader = BufferedReader(InputStreamReader(conn.inputStream))
                              val response = StringBuilder()
                              var line: String?
                              while (reader.readLine().also { line = it } != null) { response.append(line) }
                              reader.close()
                              
                              val answer = try {
                                  JSONObject(response.toString()).getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text")
                              } catch (e: Exception) { "Gagal parse API" }
                              
                              Handler(Looper.getMainLooper()).post { 
                                  removeLoading()
                                  showResult(answer) 
                              }
                          } else {
                              val err = BufferedReader(InputStreamReader(conn.errorStream))
                              val errStr = StringBuilder()
                              var line: String?
                              while (err.readLine().also { line = it } != null) { errStr.append(line) }
                              Handler(Looper.getMainLooper()).post { 
                                  removeLoading()
                                  showResult("Error API: $responseCode\n$errStr") 
                              }
                          }
                      } catch (e: Exception) {
                          Handler(Looper.getMainLooper()).post { 
                              removeLoading()
                              // JIKA TIMEOUT, MUNCULKAN PESAN INI
                              showResult("Koneksi lambat (Timeout)!\nCoba lagi atau cek sinyal WiFi lu mass.") 
                          }
                      }
                  }
              }

              private fun showResult(text: String) {
                  if (answerView == null) {
                      answerView = LayoutInflater.from(this).inflate(R.layout.floating_answer, null)
                      val params = WindowManager.LayoutParams(
                          WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else WindowManager.LayoutParams.TYPE_PHONE,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT
                      )
                      params.gravity = Gravity.CENTER
                      answerView!!.findViewById<TextView>(R.id.tvAnswer).setOnClickListener {
                          windowManager.removeView(answerView); answerView = null
                      }
                      windowManager.addView(answerView, params)
                  }
                  answerView!!.findViewById<TextView>(R.id.tvAnswer).text = text
              }
          }
          EOF

      - name: Build APK
        run: |
          chmod +x gradlew || true
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatAI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
